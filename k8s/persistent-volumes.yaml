apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: unstract-efs
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-REPLACE_ME
  directoryPerms: "750"
  gidRangeStart: "50000"
  gidRangeEnd: "70000"
  basePath: "/unstract"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unstract-files-pvc
  namespace: medical-claims
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: unstract-efs
