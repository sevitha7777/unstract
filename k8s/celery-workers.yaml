apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstract-celery-workers
  namespace: medical-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstract-celery-workers
  template:
    metadata:
      labels:
        app: unstract-celery-workers
    spec:
      serviceAccountName: medical-claims-sa
      volumes:
      - name: unstract-files
        persistentVolumeClaim:
          claimName: unstract-efs-pvc
      containers:
      - name: celery-worker
        image: 576245601309.dkr.ecr.us-east-1.amazonaws.com/unstract/workers:v1.41
        command: ["/app/run-worker.sh"]
        args: ["general"]
        envFrom:
        - configMapRef:
            name: unstract-config
        - secretRef:
            name: unstract-secrets
        env:
        - name: DJANGO_APP_BACKEND_URL
          value: "http://unstract-backend:8000"
        - name: INTERNAL_API_BASE_URL
          value: "http://unstract-backend:8000/internal"
        volumeMounts:
        - name: unstract-files
          mountPath: /tmp/prompt-studio-data
          subPath: prompt-studio-data
        - name: unstract-files
          mountPath: /tmp/workflow-execution
          subPath: workflow-execution
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          runAsUser: 0