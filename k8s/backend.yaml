apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstract-backend
  namespace: medical-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstract-backend
  template:
    metadata:
      labels:
        app: unstract-backend
    spec:
      serviceAccountName: medical-claims-sa
      volumes:
      - name: unstract-files
        persistentVolumeClaim:
          claimName: unstract-efs-pvc
      containers:
      - name: backend
        image: 576245601309.dkr.ecr.us-east-1.amazonaws.com/unstract/backend:v1.27
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: unstract-config
        - secretRef:
            name: unstract-secrets
        volumeMounts:
        - name: unstract-files
          mountPath: /tmp/prompt-studio-data
          subPath: prompt-studio-data
        - name: unstract-files
          mountPath: /tmp/workflow-execution
          subPath: workflow-execution
        resources:
          requests:
            memory: "512Mi"
            cpu: "50m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        # Health checks disabled - backend takes long to initialize
        # livenessProbe:
        #   httpGet:
        #     path: /api/v1/health/
        #     port: 8000
        #   initialDelaySeconds: 180
        #   periodSeconds: 30
        # readinessProbe:
        #   httpGet:
        #     path: /api/v1/health/
        #     port: 8000
        #   initialDelaySeconds: 150
        #   periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: unstract-backend
  namespace: medical-claims
spec:
  selector:
    app: unstract-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: unstract-backend-lb
  namespace: medical-claims
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: unstract-backend
  ports:
  - port: 80
    targetPort: 8000