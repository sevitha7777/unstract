apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstract-rabbitmq
  namespace: medical-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstract-rabbitmq
  template:
    metadata:
      labels:
        app: unstract-rabbitmq
    spec:
      serviceAccountName: medical-claims-sa
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "admin"
        - name: RABBITMQ_DEFAULT_PASS
          value: "password"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unstract-rabbitmq
  namespace: medical-claims
spec:
  selector:
    app: unstract-rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672