apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstract-prompt-service
  namespace: medical-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstract-prompt-service
  template:
    metadata:
      labels:
        app: unstract-prompt-service
    spec:
      serviceAccountName: medical-claims-sa
      volumes:
      - name: unstract-files
        persistentVolumeClaim:
          claimName: unstract-efs-pvc
      containers:
      - name: prompt-service
        image: 576245601309.dkr.ecr.us-east-1.amazonaws.com/unstract/prompt:latest
        ports:
        - containerPort: 3003
        envFrom:
        - configMapRef:
            name: unstract-config
        - secretRef:
            name: unstract-secrets
        volumeMounts:
        - name: unstract-files
          mountPath: /tmp/prompt-studio-data
          subPath: prompt-studio-data
        - name: unstract-files
          mountPath: /tmp/workflow-execution
          subPath: workflow-execution
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: unstract-prompt-service
  namespace: medical-claims
spec:
  selector:
    app: unstract-prompt-service
  ports:
  - port: 3003
    targetPort: 3003