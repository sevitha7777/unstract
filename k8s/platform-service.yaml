apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstract-platform-service
  namespace: medical-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstract-platform-service
  template:
    metadata:
      labels:
        app: unstract-platform-service
    spec:
      serviceAccountName: medical-claims-sa
      containers:
      - name: platform-service
        image: 576245601309.dkr.ecr.us-east-1.amazonaws.com/unstract/platform:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: unstract-config
        - secretRef:
            name: unstract-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: unstract-platform-service
  namespace: medical-claims
spec:
  selector:
    app: unstract-platform-service
  ports:
  - port: 3001
    targetPort: 3001