apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-override
  namespace: medical-claims
data:
  override.js: |
    // Override hardcoded localhost URLs
    (function() {
      const BACKEND_URL = 'http://k8s-medicalc-unstract-89264f6800-853dac805f0e3ed5.elb.us-east-1.amazonaws.com';
      
      // Override XMLHttpRequest
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (url.includes('localhost:8000')) {
          url = url.replace('http://localhost:8000', BACKEND_URL);
        }
        return originalOpen.call(this, method, url, ...args);
      };
      
      // Override fetch
      const originalFetch = window.fetch;
      window.fetch = function(url, ...args) {
        if (typeof url === 'string' && url.includes('localhost:8000')) {
          url = url.replace('http://localhost:8000', BACKEND_URL);
        }
        return originalFetch.call(this, url, ...args);
      };
      
      console.log('Backend URL override applied:', BACKEND_URL);
    })();