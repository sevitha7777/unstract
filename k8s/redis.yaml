apiVersion: apps/v1
kind: Deployment
metadata:
  name: unstract-redis
  namespace: medical-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstract-redis
  template:
    metadata:
      labels:
        app: unstract-redis
    spec:
      serviceAccountName: medical-claims-sa
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: unstract-redis
  namespace: medical-claims
spec:
  selector:
    app: unstract-redis
  ports:
  - port: 6379
    targetPort: 6379