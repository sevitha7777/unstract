<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="100%" viewBox="0 0 200 50" xml:space="preserve">
  <!-- Your Custom Logo Design -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="5" y="5" width="190" height="40" fill="url(#logoGradient)" rx="8"/>
  
  <!-- Logo Icon -->
  <circle cx="30" cy="25" r="12" fill="white" opacity="0.9"/>
  <circle cx="30" cy="25" r="8" fill="#1d4ed8"/>
  
  <!-- Company Name -->
  <text x="55" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Your Company
  </text>
</svg>